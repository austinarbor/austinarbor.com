name: "Theme Update"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # the theme's npm dependencies require node >= 22.12
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Hugo (extended)
        run: |
          url=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | jq -r '.assets[] | select(.name | test("^hugo_extended_[0-9.]+_linux-amd64\\.deb$")) | .browser_download_url')
          wget -qO hugo.deb "${url}"
          sudo apt-get install -y ./hugo.deb
          rm hugo.deb
          hugo version

      # the theme compiles its SCSS with Dart Sass, which Hugo does not bundle
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Update hugo modules
        run: |
          # update to latest version of all modules
          hugo mod get -u

          # update the npm dependencies
          hugo mod npm pack

          # cleanup go.sum file
          hugo mod tidy

      - name: Install node modules
        run: npm install

      - name: Build
        run: |
          # build the site
          hugo --minify
          # remove file generated by the build
          rm -rf public/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          title: Update theme
          labels: automerge
          # only commit the module update, not the generated npm files
          add-paths: |
            go.mod
            go.sum
