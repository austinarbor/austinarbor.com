name: Deploy Website
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # the theme's npm dependencies require node >= 22.12
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Latest Hugo Release
        run: |
          download_url=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest \
            | jq -r '.assets[] | select(.name | test("^hugo_extended_[0-9.]+_linux-amd64\\.deb$")) | .browser_download_url')
          wget -qO hugo.deb "${download_url}"
          sudo apt-get install -y ./hugo.deb
          rm hugo.deb

      # the theme compiles its SCSS with Dart Sass, which Hugo does not bundle
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Print Hugo Version
        run: hugo version

      - name: Mod Tidy
        run: hugo mod tidy

      - name: NPM Pack
        run: hugo mod npm pack

      - name: NPM Install
        run: npm install

      - name: Build Site
        run: hugo build

      - name: Get Public IP
        id: public-ip
        run: |
          ip_addr=$(curl https://api.ipify.org/?format=json)
          ip=$(echo "${ip_addr}" | jq --raw-output '.ip')
          echo "RUNNER_IP_ADDRESS=${ip}" >> "$GITHUB_OUTPUT"

      - name: Add Firewall Rule
        uses: adnanjaw/ip-whitelist-on-hetznerfw@v2
        with:
          hetzner_api_key: ${{ secrets.HETZNER_API_TOKEN }}
          firewall_name: ${{ secrets.HETZNER_FIREWALL_NAME }}
          ip_address: ${{ steps.public-ip.outputs.RUNNER_IP_ADDRESS }}
          protocol: tcp
          port: 21-22

      - uses: appleboy/scp-action@v1.0.0
        name: Deploy Website
        with:
          host: ${{ secrets.SCP_IP_ADDRESS }}
          username: ${{ secrets.SCP_USERNAME }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          source: public
          target: /var/www/html
          strip_components: 1
