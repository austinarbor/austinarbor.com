name: Deploy Website
run-name: Deploy Website - ${{ inputs.ref || github.ref_name }}
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Ref to build and deploy; defaults to the triggering ref'
        required: false
        type: string

# one deploy at a time: a second waits rather than swapping the site out from under the first
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # pinned so a new hugo release can't break a deploy; the theme needs >= 0.163
  HUGO_VERSION: 0.170.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.COMMIT }}
    steps:
      - name: Get Public IP
        id: public-ip
        run: |
          ip_addr=$(curl https://api.ipify.org/?format=json)
          ip=$(echo "${ip_addr}" | jq --raw-output '.ip')
          echo "RUNNER_IP_ADDRESS=${ip}" >> "$GITHUB_OUTPUT"

      # the server's Hetzner firewall lets ssh in only from known addresses; the rule is removed
      # again when the job ends (the action's cleanup)
      - name: Add Firewall Rule
        uses: adnanjaw/ip-whitelist-on-hetznerfw@v2
        with:
          hetzner_api_key: ${{ secrets.HETZNER_API_TOKEN }}
          firewall_name: ${{ secrets.HETZNER_FIREWALL_NAME }}
          ip_address: ${{ steps.public-ip.outputs.RUNNER_IP_ADDRESS }}
          protocol: tcp
          port: 21-22

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # the site has no release tags, so the commit is its version
      - name: Resolve version
        id: version
        run: |
          # github.sha is the dispatching commit, not necessarily the ref deployed
          commit=$(git rev-parse HEAD)
          echo "COMMIT=${commit}" >> "$GITHUB_OUTPUT"
          echo "deploying ${commit}"

      # hugo modules (the toha theme) are go modules
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # the theme's npm dependencies require node >= 22.12
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*

      - name: Install Hugo
        run: |
          wget -qO hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo apt-get install -y ./hugo.deb
          rm hugo.deb
          hugo version

      # the theme compiles its SCSS with Dart Sass, which hugo does not bundle
      - name: Install Dart Sass
        run: sudo snap install dart-sass

      # package.json is generated from the theme's dependencies, not checked in
      - name: Install Theme Dependencies
        run: |
          hugo mod npm pack
          npm install

      # version.txt says which commit is live: https://austinarbor.com/version.txt
      - name: Build Site
        env:
          COMMIT: ${{ steps.version.outputs.COMMIT }}
        run: |
          hugo --gc --minify --logLevel error
          test -f public/index.html
          echo "${COMMIT}" > public/version.txt

      # into a folder beside the live one, swapped in below, so a failed copy can't leave half a
      # site being served. rm clears what a failed earlier deploy may have left there
      - uses: appleboy/scp-action@v1.0.0
        name: Copy Site
        with:
          host: ${{ secrets.SCP_IP_ADDRESS }}
          username: ${{ secrets.SCP_USERNAME }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          source: public
          target: /var/www/incoming
          strip_components: 1
          rm: true

      - uses: appleboy/ssh-action@v1.2.5
        name: Swap In
        env:
          COMMIT: ${{ steps.version.outputs.COMMIT }}
        with:
          host: ${{ secrets.SCP_IP_ADDRESS }}
          username: ${{ secrets.SCP_USERNAME }}
          key: ${{ secrets.SCP_PRIVATE_KEY }}
          envs: COMMIT
          script: |
            set -e
            cd /var/www
            if ! grep -qxF "$COMMIT" incoming/version.txt; then
              echo "::error::incoming/ isn't $COMMIT; the live site wasn't touched"
              exit 1
            fi
            if [ -d html ]; then
              # same owner and mode as the live site, so the web server can still read it
              chown -R --reference=html incoming
              chmod --reference=html incoming
              # the swap replaces the whole folder; list anything that isn't part of this build
              # (it's kept in html.previous until the next deploy). fingerprinted css/js
              # (application.<sha256>.css) change name every build, so they're left out
              extra=$(cd html && find . -type f | grep -vE '\.[0-9a-f]{64}\.' \
                | while read -r f; do [ -e "../incoming/$f" ] || echo "$f"; done)
              if [ -n "$extra" ]; then
                echo "::warning::not in this build, left in /var/www/html.previous:"
                echo "$extra"
              fi
            fi
            # the live site is kept, to go back to: mv html html.bad && mv html.previous html
            rm -rf html.previous
            if [ -d html ]; then mv html html.previous; fi
            mv incoming html
            grep -qxF "$COMMIT" html/version.txt
            echo "deployed $COMMIT"
